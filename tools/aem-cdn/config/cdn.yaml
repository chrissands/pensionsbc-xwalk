# AEM as a Cloud Service CDN configuration (Cloud Manager config pipeline), program p129103.
# Deployed once by an AEM admin; see tools/aem-cdn/README.md. There is one cdn.yaml per
# environment: if the program already has one, add this rule to it.
# (Fonts in AEM Assets need no rule: AEM publish already sends Access-Control-Allow-Origin: *
# for .woff2 files.)
kind: "CDN"
version: "1"
metadata:
  envTypes: ["dev"]
data:
  responseTransformations:
    rules:
      # Event fragments (persisted GraphQL query): AEM's CORS answer depends on the Origin header,
      # so cached copies must vary by it (a copy cached for a request without Origin, e.g. curl,
      # otherwise blocks browsers for its cache lifetime).
      - name: graphql-vary-origin
        when:
          allOf:
            - reqProperty: tier
              equals: publish
            - reqProperty: path
              like: /graphql/execute.json/*
        actions:
          - type: set
            respHeader: Vary
            value: Origin
